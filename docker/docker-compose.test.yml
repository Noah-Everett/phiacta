# Test stack overlay — disables rate limiting, uses separate volumes.
#
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.test.yml up -d
#   pytest tests/integration/ -m forgejo
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.test.yml down -v

services:
  db:
    volumes:
      - pgdata_test:/var/lib/postgresql/data

  forgejo:
    volumes:
      - forgejo_data_test:/data
      - ./forgejo-entrypoint.sh:/forgejo-entrypoint.sh:ro

  backend:
    environment:
      ENVIRONMENT: "development"
      RATE_LIMIT_ENABLED: "false"
      WEBHOOK_CALLBACK_URL: "http://backend:8000/webhooks/forgejo"

volumes:
  pgdata_test:
  forgejo_data_test:
