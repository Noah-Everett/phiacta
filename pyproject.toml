[project]
name = "phiacta"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # Auth
    "PyJWT[crypto]>=2.8",
    "bcrypt>=4.0",
    "email-validator>=2.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # HTTP
    "httpx>=0.28",

    # Logging
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
]
all = ["phiacta[dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phiacta"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/phiacta/core/db/migrations/versions/*.py" = ["E501"]
"src/phiacta/core/api/*.py" = ["B008"]
"src/phiacta/core/webhooks/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
